[Rainmeter]
Update=1000
; Using a solid color so it doesn't rely on missing image files
SolidColor=15,15,20,220
BackgroundMode=2

[Metadata]
Name=TCI Internet
Author=You
Information=Displays TCI internet usage.

[Variables]
fontName=Trebuchet MS
textSize=8
colorBar=235,170,0,255
colorText=255,255,255,205

; ================= MEASURES =================
[MeasureData]
Measure=WebParser
Url=file:///C:/RainmeterTCI/tci_data.txt
RegExp=(?siU)^(.*)\|(.*)\|(.*)\|(.*)\|(.*)\|(.*)$
UpdateRate=60
FinishAction=[!UpdateMeter *][!Redraw]

[MeasureVolRemaining]
Measure=WebParser
Url=[MeasureData]
StringIndex=1

[MeasureVolTotal]
Measure=WebParser
Url=[MeasureData]
StringIndex=2

[MeasureDaysRemaining]
Measure=WebParser
Url=[MeasureData]
StringIndex=3

[MeasureDaysTotal]
Measure=WebParser
Url=[MeasureData]
StringIndex=4

[MeasureTimestamp]
Measure=WebParser
Url=[MeasureData]
StringIndex=5

[MeasureStatus]
Measure=WebParser
Url=[MeasureData]
StringIndex=6

[MeasureVolPercent]
Measure=Calc
Formula=(MeasureVolTotal > 0) ? (MeasureVolRemaining / MeasureVolTotal * 100) : 0
MinValue=0
MaxValue=100

[MeasureDaysPercent]
Measure=Calc
Formula=(MeasureDaysTotal > 0) ? (MeasureDaysRemaining / MeasureDaysTotal * 100) : 0
MinValue=0
MaxValue=100

[MeasureIsError]
Measure=Calc
Formula=([MeasureStatus] = "ok") ? 0 : 1
DynamicVariables=1

; ================= STYLES =================
[styleTitle]
StringAlign=Center
StringCase=Upper
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,50
FontColor=#colorText#
FontFace=#fontName#
FontSize=10
AntiAlias=1
ClipString=1

[styleLeftText]
StringAlign=Left
StringCase=None
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

[styleRightText]
StringAlign=Right
StringCase=None
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

[styleBar]
BarColor=#colorBar#
BarOrientation=HORIZONTAL
SolidColor=255,255,255,15
MinValue=0
MaxValue=100

; ================= METERS =================
[meterTitle]
Meter=String
MeterStyle=styleTitle
X=100
Y=12
W=190
H=18
Text=TCI Internet

[meterVolLabel]
Meter=String
MeterStyle=styleLeftText
X=10
Y=40
W=190
H=14
Text=Volume

[meterVolValue]
Meter=String
MeterStyle=styleRightText
MeasureName=MeasureVolRemaining
MeasureName2=MeasureVolTotal
X=200
Y=0r
W=190
H=14
Text=%1 / %2 GB

[meterVolBar]
Meter=Bar
MeterStyle=styleBar
MeasureName=MeasureVolPercent
X=10
Y=52
W=190
H=1

[meterDaysLabel]
Meter=String
MeterStyle=styleLeftText
X=10
Y=60
W=190
H=14
Text=Days

[meterDaysValue]
Meter=String
MeterStyle=styleRightText
MeasureName=MeasureDaysRemaining
MeasureName2=MeasureDaysTotal
X=200
Y=0r
W=190
H=14
Text=%1 / %2 days

[meterDaysBar]
Meter=Bar
MeterStyle=styleBar
MeasureName=MeasureDaysPercent
X=10
Y=72
W=190
H=1

[meterUpdatedLabel]
Meter=String
MeterStyle=styleLeftText
X=10
Y=80
W=190
H=14
Text=Updated

[meterUpdatedValue]
Meter=String
MeterStyle=styleRightText
MeasureName=MeasureTimestamp
X=200
Y=0r
W=190
H=14
Text=%1

[meterError]
Meter=String
MeterStyle=styleLeftText
X=10
Y=98
W=190
H=14
FontColor=255,80,80,255
Text=Script Error!
AntiAlias=1
Hidden=([MeasureIsError] = 1 ? 0 : 1)
DynamicVariables=1

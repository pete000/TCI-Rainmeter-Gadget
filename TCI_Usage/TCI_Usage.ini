[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=15,15,20,200

[Metadata]
Name=TCI Usage
Author=You

; ================= MEASURES =================
[MeasureData]
Measure=WebParser
Url=file:///C:/RainmeterTCI/tci_data.txt
RegExp=(?siU)^([^|]+)\|([^|]+)\|([^|]+)\|([^|]+)\|([^|]+)\|([^|\r\n]+)
UpdateRate=60
FinishAction=[!UpdateMeter *][!Redraw]

[MeasureVolRemaining]
Measure=WebParser
Url=[MeasureData]
StringIndex=1

[MeasureVolTotal]
Measure=WebParser
Url=[MeasureData]
StringIndex=2

[MeasureDaysRemaining]
Measure=WebParser
Url=[MeasureData]
StringIndex=3

[MeasureDaysTotal]
Measure=WebParser
Url=[MeasureData]
StringIndex=4

[MeasureTimestamp]
Measure=WebParser
Url=[MeasureData]
StringIndex=5

[MeasureStatus]
Measure=WebParser
Url=[MeasureData]
StringIndex=6

[MeasureVolPercent]
Measure=Calc
Formula=(MeasureVolTotal > 0) ? (MeasureVolRemaining / MeasureVolTotal * 100) : 0

[MeasureDaysPercent]
Measure=Calc
Formula=(MeasureDaysTotal > 0) ? (MeasureDaysRemaining / MeasureDaysTotal * 100) : 0

; ================= METERS =================
[MeterTitle]
Meter=String
X=12
Y=8
FontFace=Segoe UI
FontSize=12
FontWeight=650
FontColor=255,255,255,255
Text="TCI Internet"
AntiAlias=1

[MeterVolLabel]
Meter=String
X=12
Y=34
FontFace=Segoe UI
FontSize=9
FontColor=170,170,180,255
Text="Volume"
AntiAlias=1

[MeterVolValues]
Meter=String
X=12
Y=48
FontFace=Segoe UI
FontSize=12
FontWeight=600
FontColor=80,220,120,255
MeasureName=MeasureVolRemaining
MeasureName2=MeasureVolTotal
Text="%1 / %2 GB"
AntiAlias=1

[MeterVolBar]
Meter=Bar
MeasureName=MeasureVolPercent
X=12
Y=70
W=196
H=5
BarColor=80,220,120,255
SolidColor=40,40,45,255

[MeterDaysLabel]
Meter=String
X=12
Y=86
FontFace=Segoe UI
FontSize=9
FontColor=170,170,180,255
Text="Days"
AntiAlias=1

[MeterDaysValues]
Meter=String
X=12
Y=100
FontFace=Segoe UI
FontSize=12
FontWeight=600
FontColor=90,200,255,255
MeasureName=MeasureDaysRemaining
MeasureName2=MeasureDaysTotal
Text="%1 / %2 days"
AntiAlias=1

[MeterDaysBar]
Meter=Bar
MeasureName=MeasureDaysPercent
X=12
Y=122
W=196
H=5
BarColor=90,200,255,255
SolidColor=40,40,45,255

[MeterUpdated]
Meter=String
X=12
Y=136
FontFace=Segoe UI
FontSize=8
FontColor=120,120,130,255
MeasureName=MeasureTimestamp
Text="Updated %1"
AntiAlias=1

[MeterStatus]
Meter=String
X=12
Y=150
FontFace=Segoe UI
FontSize=8
FontColor=255,80,80,255
MeasureName=MeasureStatus
Text="⚠ %1"
Hidden=1
AntiAlias=1

[MeterStatusToggle]
MeasureName=MeasureStatus
Meter=String
X=0
Y=0
W=0
H=0
Hidden=1
; Show the error line only when status != ok
OnUpdateAction=[!SetOption MeterStatus Hidden "([&MeasureStatus] = \"ok\" ? 1 : 0)"]
DynamicVariables=1